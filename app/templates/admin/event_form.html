{% extends "base.html" %}

{% block title %}{{ "Editar" if event else "Crear" }} evento - Ticket App{% endblock %}

{% block content %}
<section class="admin-form">
    <h1>{{ "Editar" if event else "Crear nuevo" }} evento</h1>

    <form method="POST" action="{% if event %}{{ url_for('admin.update_event', event_id=event.event_id) }}{% else %}{{ url_for('admin.create_event') }}{% endif %}">
        <div class="form-group">
            <label for="name">Nombre del evento *</label>
            <input type="text" id="name" name="name" value="{{ event.name if event else '' }}" required>
        </div>
        <div class="form-group">
            <label for="description">Descripcion</label>
            <textarea id="description" name="description" rows="3">{{ event.description if event else '' }}</textarea>
        </div>
        <div class="form-group">
            <label for="date">Fecha y hora *</label>
            <input type="datetime-local" id="date" name="date" value="{{ event.date if event else '' }}" required>
        </div>
        <div class="form-group">
            <label for="venue">Lugar *</label>
            <input type="text" id="venue" name="venue" value="{{ event.venue if event else '' }}" required>
        </div>
        <div class="form-group">
            <label for="price">Precio por entrada *</label>
            <input type="number" id="price" name="price" step="0.01" min="0" value="{{ event.price if event else '' }}" required>
        </div>
        <div class="form-group">
            <label for="currency">Moneda</label>
            <select id="currency" name="currency">
                <option value="eur" {{ 'selected' if not event or event.currency == 'eur' }}>EUR</option>
                <option value="usd" {{ 'selected' if event and event.currency == 'usd' }}>USD</option>
                <option value="gbp" {{ 'selected' if event and event.currency == 'gbp' }}>GBP</option>
            </select>
        </div>
        <div class="form-group">
            <label for="max_tickets">Aforo maximo *</label>
            <input type="number" id="max_tickets" name="max_tickets" min="1" value="{{ event.max_tickets if event else '' }}" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn">{{ "Guardar cambios" if event else "Crear evento" }}</button>
            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
