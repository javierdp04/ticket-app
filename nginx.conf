# Bloque HTTP: redirige todo el trafico a HTTPS
# Personalizar: reemplazar tudominio.com por tu dominio real
server {
    listen 80;
    server_name tudominio.com;

    return 301 https://$host$request_uri;
}

# Bloque HTTPS: proxy inverso a Gunicorn
# Personalizar: reemplazar tudominio.com y tuusuario por valores reales
server {
    listen 443 ssl http2;
    server_name tudominio.com;

    # Certificados Let's Encrypt (generados con: certbot --nginx -d tudominio.com)
    # Personalizar: reemplazar tudominio.com por tu dominio real
    ssl_certificate /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;

    # SSL hardening: solo TLS 1.2+ con cifrados fuertes
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cabeceras de seguridad (refuerzan las que Flask ya pone)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Tamano maximo de subida: 6M (el codigo limita imagenes a 5MB)
    client_max_body_size 6M;

    # Archivos estaticos servidos directamente por Nginx (sin pasar por Gunicorn)
    # Personalizar: reemplazar tuusuario por el usuario real del sistema
    location /static/ {
        alias /home/tuusuario/ticket-app/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy inverso a Gunicorn (puerto 8000, solo escucha en localhost)
    # Importante: proxy_read_timeout 60s para que los webhooks de Stripe no hagan timeout
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
